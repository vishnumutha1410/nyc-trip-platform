# Phase 2: change data capture from Postgres to the warehouse.
#
# Four services. Memory is deliberately capped throughout - this has to run
# alongside your existing work on an 8GB machine.
#
#   postgres  the "application" database, with logical replication enabled
#   redpanda  Kafka-API broker, single binary, no ZooKeeper
#   console   web UI at localhost:8080 for browsing topics and messages
#   connect   Kafka Connect running the Debezium Postgres connector
#
# Bring it up:   docker compose up -d
# Watch logs:    docker compose logs -f connect
# Tear down:     docker compose down -v      (-v also drops the data)

services:
  postgres:
    image: postgres:16
    container_name: cdc-postgres
    # wal_level=logical is the whole reason CDC is possible. It tells Postgres
    # to write enough detail into the write-ahead log for an external reader to
    # reconstruct row changes. Without it Debezium has nothing to read.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: ordersdb
    ports:
      - "5432:5432"
    volumes:
      - ./cdc/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: cdc-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # INTERNAL is how other containers reach it; EXTERNAL is how your laptop
      # does. Getting these backwards is the classic Kafka-in-Docker mistake.
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    container_name: cdc-console
    environment:
      KAFKA_BROKERS: redpanda:29092
      CONNECT_ENABLED: "true"
      CONNECT_CLUSTERS_NAME: debezium
      CONNECT_CLUSTERS_URL: http://connect:8083
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  connect:
    image: debezium/connect:2.7.3.Final
    container_name: cdc-connect
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      # Plain JSON without embedded schemas. Debezium defaults to attaching a
      # full Avro-style schema to every message, which triples the size and
      # makes them unreadable by eye. Schemas off keeps the payloads legible
      # while you are learning what they look like.
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Cap the JVM. Connect will happily take a couple of GB otherwise.
      JAVA_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "8083:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
